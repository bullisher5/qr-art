<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI QR Art Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Create Art QR</h1>

        <label for="text-input">What to encode:</label>
        <input type="text" id="text-input" placeholder="https://example.com or any text">

        <label for="image-input">Choose an image for style:</label>
        <input type="file" id="image-input" accept="image/*">

        <button id="generate-btn">Generate QR Code</button>

        <div id="qr-result">
            <p>Your QR code will appear here</p>
        </div>

        <button id="download-btn" style="display: none;">Download QR</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
