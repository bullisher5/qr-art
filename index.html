<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art QR Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Create Art QR</h1>

        <label for="text-input">What to encode:</label>
        <input type="text" id="text-input" placeholder="https://example.com or any text">

        <label for="image-input">Choose an image for background:</label>
        <input type="file" id="image-input" accept="image/*">

        <label for="color-picker">QR color:</label>
        <input type="color" id="color-picker" value="#00ffff">

        <div class="slider-group">
            <label for="opacity-slider">Background opacity: <span id="opacity-value">40</span>%</label>
            <input type="range" id="opacity-slider" min="10" max="90" value="40">
        </div>

        <button id="generate-btn">Generate Art QR</button>
        <div id="status-message"></div>

        <div id="qr-result">
            <p>Your QR code will appear here</p>
        </div>

        <button id="download-btn" style="display: none;">Download QR</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
